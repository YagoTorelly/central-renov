name: Deploy Heroku

on:
  push:
    branches:
      - main

jobs:
  auditoria:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias do backend
        working-directory: backend
        run: npm ci

      # informativo - nao bloqueia o deploy. npm audit costuma acusar
      # vulnerabilidades irrelevantes em devDependencies; serve pra ficar de
      # olho, nao pra travar automaticamente.
      - name: npm audit (informativo)
        working-directory: backend
        run: npm audit --audit-level=high
        continue-on-error: true

  deploy:
    needs: auditoria
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy para Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP: ${{ secrets.HEROKU_APP_NAME }}
        run: |
          git remote add heroku https://heroku:$HEROKU_API_KEY@git.heroku.com/$HEROKU_APP.git
          git subtree push --prefix backend heroku main
